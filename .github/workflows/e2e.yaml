name: Playwright E2E Tests

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "release/**"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Run in the official Playwright image so the @visual screenshots render
    # exactly as in e2e/scripts/update-visual-baseline.sh. Keep this tag equal
    # to the installed @playwright/test version, and update both together.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: npm

      - if: ${{ steps.cache-npm.outputs.cache-hit == 'false' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list

      - name: Install
        run: npm ci

      - name: Run E2E tests
        run: |
          npm run build
          npm run test:e2e
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 7
